<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ORT Mock Test 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=PT+Sans:wght@400;700&family=PT+Mono&display=swap">
<style>
/* Layout: a single answer-sheet column; each question is a row with Cyrillic answer bubbles, a sticky bar carries language, timer and score. */
:root {
  --paper: #f7f8f6;
  --sheet: #ffffff;
  --ink: #1d2a33;
  --muted: #5d6b72;
  --line: #d8dfe0;
  --accent: #0f6b74;
  --accent-soft: #dcefef;
  --good: #23784a;
  --good-soft: #def2e5;
  --bad: #b23a2e;
  --bad-soft: #f8e1dd;
  --f-display: "PT Serif", Georgia, "Times New Roman", serif;
  --f-body: "PT Sans", "Segoe UI", Arial, sans-serif;
  --f-mono: "PT Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #121a1e; --sheet: #182227; --ink: #e3eaec; --muted: #94a3a9; --line: #2c3a40;
  --accent: #5cc3c9; --accent-soft: #19393c; --good: #6fd29a; --good-soft: #17332a; --bad: #f08b7e; --bad-soft: #3c201d;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #121a1e; --sheet: #182227; --ink: #e3eaec; --muted: #94a3a9; --line: #2c3a40;
  --accent: #5cc3c9; --accent-soft: #19393c; --good: #6fd29a; --good-soft: #17332a; --bad: #f08b7e; --bad-soft: #3c201d;
  color-scheme: dark }

body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { padding-block: 32px 20px; display: grid; gap: 8px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
h1 { font-family: var(--f-display); font-size: clamp(28px, 6vw, 40px); line-height: 1.15; margin: 0; text-wrap: balance; }
.lede { color: var(--muted); margin: 0; max-width: 62ch; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--sheet); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--ink); font: 700 14px var(--f-body); padding: 6px 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--sheet); }
.timer { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 18px; min-width: 5.5ch; }
.timer.low { color: var(--bad); }
.btn { border: 1px solid var(--accent); background: transparent; color: var(--accent); font: 700 14px var(--f-body); padding: 7px 14px; border-radius: 8px; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--sheet); }
.btn:focus-visible, .seg button:focus-visible, .bubble input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.spacer { flex: 1; }
.progress { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

.score { margin-block: 20px 0; padding: 16px; background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; display: grid; gap: 10px; }
.score h2 { margin: 0; font-family: var(--f-display); font-size: 22px; }
.score table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
.score td { padding: 4px 0; border-bottom: 1px solid var(--line); }
.score td:last-child { text-align: right; font-family: var(--f-mono); }

section.part { margin-block: 28px; }
.part-head { display: grid; gap: 4px; padding-bottom: 10px; border-bottom: 2px solid var(--ink); }
.part-head h2 { margin: 0; font-family: var(--f-display); font-size: 24px; }
.part-head p { margin: 0; color: var(--muted); font-size: 15px; }
.legend { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 14px; color: var(--muted); }
.legend b { color: var(--ink); font-family: var(--f-mono); }

.passage { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-top: 14px; font-family: var(--f-display); font-size: 17px; line-height: 1.65; }
.passage p { margin: 0; max-width: 65ch; }

.q { display: grid; grid-template-columns: 2.4em minmax(0, 1fr); gap: 4px 10px; padding-block: 16px; border-bottom: 1px solid var(--line); }
.q .num { font-family: var(--f-mono); color: var(--muted); padding-top: 2px; }
.q .body { min-width: 0; display: grid; gap: 10px; }
.q .stem { margin: 0; }
.cond { font-size: 15px; color: var(--muted); }
.cmp { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--sheet); }
.cmp div { padding: 8px 12px; display: grid; gap: 2px; }
.cmp div + div { border-left: 1px solid var(--line); }
.cmp small { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.cmp span { font-family: var(--f-mono); font-size: 17px; }
.cmp span.text { font-family: var(--f-body); font-size: 15px; }
.opts { display: grid; gap: 6px; }
.bubble { display: grid; grid-template-columns: 30px minmax(0, 1fr); align-items: center; gap: 10px; cursor: pointer; padding: 4px 6px; border-radius: 8px; }
.bubble input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.bubble .dot { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; font: 700 13px var(--f-body); color: var(--muted); }
.bubble input:checked + .dot { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
.bubble:hover .dot { border-color: var(--accent); }
.graded .bubble { cursor: default; }
.bubble.right { background: var(--good-soft); }
.bubble.right .dot { border-color: var(--good); color: var(--good); }
.bubble.right input:checked + .dot { background: var(--good); border-color: var(--good); color: var(--sheet); }
.bubble.wrong { background: var(--bad-soft); }
.bubble.wrong input:checked + .dot { background: var(--bad); border-color: var(--bad); }
.why { margin: 0; font-size: 14px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; }
.mark { font-size: 13px; font-weight: 700; }
.mark.ok { color: var(--good); } .mark.no { color: var(--bad); }

footer { padding-block: 24px 48px; color: var(--muted); font-size: 14px; }
footer p { margin: 0 0 6px; max-width: 65ch; }
@media (max-width: 480px) { .cmp { grid-template-columns: 1fr; } .cmp div + div { border-left: 0; border-top: 1px solid var(--line); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">

    start: "Таймерди баштоо", pause: "Тыныгуу", check: "Текшерүү", reset: "Кайра баштоо", resetConfirm: "Чын эле тазалайсызбы?",

      { id: "m1-3", cond: "x > 0", a: "x", b: "x²", ans: 3, why: { ky: "x = 2 болсо x² чоң, x = 0,5 болсо x чоң, x = 1 болсо барабар.", ru: "При x = 2 больше x², при x = 0,5 больше x, при x = 1 они равны." } },

      { id: "m1-5", cond: "a + b = 10,  a − b = 4", a: "a", b: "2b", ans: 0, why: { ky: "Теңдемелерди кошсок 2a = 14, a = 7, b = 3, 2b = 6.", ru: "Сложив уравнения, 2a = 14, a = 7, b = 3, 2b = 6." } },

    if (sec.kind === "cmp") html += `<ul class="legend">${CMP_OPTS[L].map((o, i) => `<li><b>${LETTERS[i]}</b> ${esc(o)}</li>`).join("")}</ul>`;
    html += `</div>`;
    if (sec.passage) html += `<div class="passage"><p>${esc(sec.passage[L])}</p></div>`;
    for (const it of itemsFor(sec, L)) {
      n++;
      const chosen = state.answers[it.id];
      let stem = "";
      if (sec.kind === "cmp") {
        const a = pick(it.a, L), b = pick(it.b, L);
        if (it.cond) stem += `<p class="stem cond">${esc(pick(it.cond, L))}</p>`;
        stem += `<div class="cmp"><div><small>${T.colA}</small><span class="${isTextual(a) ? "text" : ""}">${esc(a)}</span></div><div><small>${T.colB}</small><span class="${isTextual(b) ? "text" : ""}">${esc(b)}</span></div></div>`;
      } else {
        stem = `<p class="stem">${esc(pick(it.stem, L))}</p>`;
      }
      const opts = optsFor(sec, it, L).map((o, i) => {
        let cls = "bubble";
        if (state.graded) { if (i === it.ans) cls += " right"; else if (i === chosen) cls += " wrong"; }
        return `<label class="${cls}"><input type="radio" id="${it.id}-${i}" name="${it.id}" value="${i}"${chosen === i ? " checked" : ""}${state.graded ? " disabled" : ""}><span class="dot" aria-hidden="true">${LETTERS[i]}</span><span>${esc(o)}</span></label>`;
      }).join("");
      let feedback = "";
      if (state.graded) {
        const ok = chosen === it.ans;
        const head = ok ? `<span class="mark ok">${T.correct}.</span>` : `<span class="mark no">${chosen === undefined ? T.blank : T.yourWrong} ${LETTERS[it.ans]}.</span>`;
        feedback = `<p class="why">${head} ${esc(pick(it.why, L))}</p>`;
      }
      html += `<div class="q"><span class="num">${n}.</span><div class="body">${stem}<div class="opts" role="radiogroup">${opts}</div>${feedback}</div></div>`;
    }
    html += `</section>`;
  }
  document.getElementById("test").innerHTML = html;
  renderProgress();
  renderScore();
}

function renderProgress() {
  const items = allItems(state.lang);
  const a = items.filter(x => state.answers[x.it.id] !== undefined).length;
  document.getElementById("progress").textContent = UI[state.lang].progress(a, items.length);
}

function renderScore() {
  const box = document.getElementById("score");
  if (!state.graded) { box.hidden = true; return; }
  const L = state.lang, T = UI[L];
  let total = 0, max = 0, rows = "";
  for (const sec of SECTIONS) {
    const items = itemsFor(sec, L);
    const s = items.filter(it => state.answers[it.id] === it.ans).length;
    total += s; max += items.length;
    rows += `<tr><td>${esc(sec.title[L])}</td><td>${s} / ${items.length}</td></tr>`;
  }
  box.innerHTML = `<h2>${T.scoreTitle(total, max)}</h2><table>${rows}</table>`;
  box.hidden = false;
}

document.getElementById("test").addEventListener("change", e => {
  if (e.target.type !== "radio") return;
  state.answers[e.target.name] = Number(e.target.value);
  save(); renderProgress();
});
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => { state.lang = b.dataset.lang; save(); render(); }));
document.getElementById("check-btn").addEventListener("click", () => {
  state.graded = true; stopTimer(); save(); render();
  document.getElementById("score").scrollIntoView({ block: "start", behavior: "smooth" });
});
let resetArmed = false;
document.getElementById("reset-btn").addEventListener("click", e => {
  const btn = e.currentTarget;
  if (!resetArmed) { resetArmed = true; btn.textContent = UI[state.lang].resetConfirm; setTimeout(() => { resetArmed = false; btn.textContent = UI[state.lang].reset; }, 3000); return; }
  resetArmed = false; stopTimer();
  state = { lang: state.lang, answers: {}, graded: false, timeLeft: 3600 };
  save(); drawTimer(); render(); window.scrollTo(0, 0);
});

let tick = null;
function drawTimer() {
  const t = Math.max(0, state.timeLeft), el = document.getElementById("timer");
  el.textContent = `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`;
  el.classList.toggle("low", t <= 300);
}
function updateTimerBtn() { document.getElementById("timer-btn").textContent = tick ? UI[state.lang].pause : UI[state.lang].start; }
function stopTimer() { clearInterval(tick); tick = null; updateTimerBtn(); }
document.getElementById("timer-btn").addEventListener("click", () => {
  if (tick) { stopTimer(); save(); return; }
  if (state.graded || state.timeLeft <= 0) return;
  tick = setInterval(() => {
    state.timeLeft--; drawTimer();
    if (state.timeLeft % 10 === 0) save();
    if (state.timeLeft <= 0) { stopTimer(); state.graded = true; save(); render(); }
  }, 1000);
  updateTimerBtn();
});

drawTimer();
render();
</script>

</body></html>
