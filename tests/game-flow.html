<!doctype html>
<html><head><title>game test</title><meta charset="utf-8"><link rel="stylesheet" href="../css/styles.css"></head>
<body>
<header class="topbar"><div class="wrap"><button type="button" class="brand" id="brand"></button><span class="spacer"></span><button type="button" class="chip lv" id="lvchip" hidden></button><div class="seg"><button type="button" data-lang="ru">Рус</button><button type="button" data-lang="ky">Кыр</button><button type="button" data-lang="en">EN</button></div></div></header>
<main id="app" class="wrap"></main>
<nav class="tabbar" id="tabbar" hidden><button type="button" data-tab="home"><span></span></button><button type="button" data-tab="subjects"><span></span></button><button type="button" data-tab="trophies"><span></span></button><button type="button" data-tab="settings"><span></span></button></nav><!-- Game flow test, no accounts. Run like tests/accounts-flow.html. -->
<script>localStorage.clear(); localStorage.setItem("ort-tutor-lang", "en");  // the checks read English text</script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/game.js"></script>
<script src="../js/guide.js"></script>
<script src="../js/paidformat.js"></script>
<script src="../js/subjects.js"></script>
<script src="../js/data/math.js"></script>
<script src="../js/data/analogies.js"></script>
<script src="../js/data/sentences.js"></script>
<script src="../js/data/reading.js"></script>
<script src="../js/data/grammar.js"></script>
<script src="../js/app.js"></script>
<script>
const log = [];
const ok = (cond, msg) => log.push((cond ? "PASS " : "FAIL ") + msg);
const $ = s => document.querySelector(s);
const click = s => { const el = $(s); if (!el) throw new Error("missing " + s); el.click(); };
const choose = k => { const r = document.getElementById("opt-" + k); r.checked = true; r.dispatchEvent(new Event("change", { bubbles: true })); };
const wait = ms => new Promise(r => setTimeout(r, ms));
(async () => {
  try {
    ok(/Level 1/.test($("#app").textContent), "home shows player card at level 1");
    // Practice quiz: all right on the first maths topic.
    click('#tabbar [data-tab="subjects"]');
    click('[data-act="subject"][data-arg="math"]');
    click('[data-act="topic"]');
    click('[data-act="start"]');
    const n = quiz.items.length;
    for (let i = 0; i < n; i++) {
      choose(quiz.items[i].q.ans); click('[data-act="check"]');
      if (i === 2) ok(/\+15 XP/.test($(".fb").textContent), "3rd right in a row shows +15 XP combo");
      click(i === n - 1 ? '[data-act="finish"]' : '[data-act="next"]');
    }
    const expected = n * 10 + Math.max(0, n - 2) * 5 + 50;
    ok(view.name === "results", "practice ends on results");
    ok(saved.xp === expected, `XP after perfect topic = ${saved.xp} (expected ${expected})`);
    ok(saved.badges["first-right"] && saved.badges["combo-5"] && saved.badges["master-1"], "first-right, combo-5, master-1 badges earned");
    ok(saved.stats.answered === n && saved.days[dayKey()] === n, "answers counted for today");
    await wait(100);
    ok(document.querySelectorAll(".toast").length > 0, "toasts shown");
    // Retake: no second mastery bonus.
    const xpBefore = saved.xp;
    saved.goal = n + 1;  // so the retake crosses the daily goal
    click('[data-act="start"]');
    for (let i = 0; i < n; i++) { choose(quiz.items[i].q.ans); click('[data-act="check"]'); click(i === n - 1 ? '[data-act="finish"]' : '[data-act="next"]'); }
    ok(saved.xp - xpBefore === n * 10 + (n - 2) * 5 + 30, `retake earns no mastery bonus but hits the 20/day goal (+${saved.xp - xpBefore})`);
    ok(saved.badges.goal, "daily goal badge earned");
    // Timed challenge: answer 2 right, skip the rest.
    click('[data-act="subject"]');
    click('[data-act="timed"]');
    ok(quiz.mode === "timed" && quiz.items.length === 10 && !!$("#timer"), "timed challenge starts with 10 questions and a clock");
    choose(quiz.items[0].q.ans); ok($('[data-act="tnext"]').textContent === T().next, "button changes from Skip to Next after picking");
    click('[data-act="tnext"]');
    ok(!$(".fb"), "no feedback during the timed challenge");
    choose(quiz.items[1].q.ans); click('[data-act="tnext"]');
    for (let i = 2; i < 10; i++) click('[data-act="tnext"]');
    ok(view.name === "results" && saved.timed.math === 20, "timed results saved as 20%");
    ok(/No answer/.test($("#app").textContent) && /Time used/.test($("#app").textContent), "results show unanswered questions and time used");
    ok(saved.badges["timed-1"], "timed badge earned");
    // Time running out.
    click('[data-act="timed"]');
    quiz.deadline = Date.now() - 1;
    await wait(800);
    ok(view.name === "results" && quiz.timeUp && /Time is up/.test($("#app").textContent), "clock running out ends the test");
    ok(timer === null, "timer stopped");
    // Trophies in all languages.
    for (const l of ["en", "ru", "ky"]) {
      document.querySelector(`.topbar [data-lang="${l}"]`).click();
      click("#brand"); click('[data-act="trophies"]');
      ok(document.querySelectorAll(".badge.got").length >= 5 && !/undefined/.test($("#app").innerHTML), l + " trophies page renders with earned badges");
    }
    click('[data-act="goal"][data-arg="30"]'); ok(saved.goal === 30, "daily goal can be changed");
    const stored = JSON.parse(localStorage.getItem("ort-tutor-v1"));
    ok(stored.xp === saved.xp && stored.badges.goal, "progress persisted to localStorage");
  } catch (e) { log.push("FAIL error: " + e.message); }
  const out = document.createElement("pre"); out.id = "result"; out.textContent = "RESULT\n" + log.join("\n"); document.body.appendChild(out);
})();
</script>
</body></html>
