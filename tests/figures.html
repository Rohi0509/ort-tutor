<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>figures test</title>
<link rel="stylesheet" href="../css/styles.css">
<style>main { padding-bottom: 40px; } .sample { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; } .sample h3 { margin-bottom: 8px; }</style>
</head>
<body>
<!-- Gallery and test for js/figures.js: draws one sample of each figure type (a reference when writing questions),
     and prints PASS/FAIL lines. Run with node tools/browser-tests.js, or open it in a browser to look. -->
<main id="app" class="wrap"></main>
<pre id="out"></pre>
<script src="../js/figures.js"></script>
<script>
const SAMPLES = {
  "numberline: order of points": { type: "numberline", min: -4, max: 4, points: [{ at: -3, label: "x" }, { at: -1.5, label: "y" }, { at: 0, label: "0" }, { at: 2.5, label: "z" }] },
  "numberline with ticks": { type: "numberline", min: -3, max: 3, ticks: [-3, -2, -1, 0, 1, 2, 3], points: [{ at: -1.5, label: "a" }, { at: 2, label: "b" }] },
  "geo: angles at a point on a line": { type: "geo", points: { A: [-4, 0], B: [0, 0], C: [4, 0], D: [-2.4, 3], E: [3.2, 1.9] },
    segments: [["A", "C"]], rays: [["B", "D"], ["B", "E"]], hide: ["D", "E"],
    angles: [{ at: "B", from: "A", to: "D", label: "52°" }, { at: "B", from: "D", to: "E", label: "β°" }, { at: "B", from: "E", to: "C", label: "α°" }] },
  "geo: right triangle with sides": { type: "geo", points: { A: [0, 0], B: [4, 0], C: [0, 3] }, polygons: [["A", "B", "C"]],
    angles: [{ at: "A", from: "B", to: "C", right: true }], sides: [{ from: "A", to: "B", label: "8 см" }, { from: "A", to: "C", label: "6 см" }, { from: "B", to: "C", label: "?" }] },
  "geo: triangle in a circle": { type: "geo", points: { O: [0, 0], A: [-3, 0], B: [3, 0], C: [1.2, 2.75] }, circles: [{ c: "O", r: 3 }],
    polygons: [["A", "B", "C"]], dots: true, angles: [{ at: "C", from: "A", to: "B", right: true }] },
  "coord: square on a grid": { type: "coord", xmin: -6, xmax: 3, ymin: -2, ymax: 7, numbers: true,
    polygons: [[[-5, -1], [-5, 6], [2, 6], [2, -1]]], points: [{ x: -5, y: 6, label: "B(−5; 6)" }, { x: 2, y: -1, label: "D(2; −1)" }] },
  "coord: graph of f′(x)": { type: "coord", xmin: -5, xmax: 5, ymin: -3, ymax: 3,
    curves: [{ pts: [[-4.5, 1.5], [-3, 0], [-1.5, -1.5], [0, 0], [1.5, 2], [3, 0], [4.5, -2]], smooth: true, label: "y = f′(x)" }] },
  "table": { type: "table", head: ["Балл", "Число учеников"], rows: [[1, 3], [2, 5], [3, 8], [4, 4]] }
};
const out = [];
const ok = (c, m) => out.push((c ? "PASS " : "FAIL ") + m);
let html = "<h1>Figures</h1>";
for (const [name, f] of Object.entries(SAMPLES)) {
  const errs = validateFig(f), h = figHtml(f);
  ok(!errs.length, name + " is a valid spec" + (errs.length ? ": " + errs.join("; ") : ""));
  ok(/<svg|<table/.test(h) && !/NaN|undefined|Infinity/.test(h), name + " draws without NaN or missing text");
  html += `<div class="sample"><h3>${name}</h3>${h}</div>`;
}
document.getElementById("app").innerHTML = html;
// Every drawing fits on a phone: no SVG is wider than its container.
for (const svg of document.querySelectorAll(".fig svg")) ok(svg.getBoundingClientRect().width <= svg.parentElement.getBoundingClientRect().width + 1, "figure fits its box");
// The checker catches mistakes.
ok(validateFig({ type: "geo", points: { A: [0, 0] }, segments: [["A", "Z"]] }).some(e => /unknown point "Z"/.test(e)), "unknown point is caught");
ok(validateFig({ type: "coord", xmin: 0, xmax: 100, ymin: 0, ymax: 5 }).some(e => /too dense/.test(e)), "too dense grid is caught");
ok(validateFig({ type: "circle" }).length === 1, "unknown type is caught");
document.getElementById("out").textContent = "RESULTS\n" + out.join("\n");
</script>
</body></html>
