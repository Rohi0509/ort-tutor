# Runs the content check and the browser tests on every push and pull request.
# A red cross on the commit in GitHub means something broke; the log shows which check failed.
name: Checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Content check (every screen in ru, ky, en)
        run: node tools/check.js
      - name: Paid-question format (example file)
        run: node tools/check-paid.js
      - name: Browser tests (accounts, codes, game)
        run: node tools/browser-tests.js
